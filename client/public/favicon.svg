<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Theme Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Accent Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Inner Glow -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.45"/>
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base with Rich Theme Gradient -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle High-tech Border Inset -->
  <rect x="20" y="20" width="472" height="472" rx="106" fill="none" stroke="url(#glowGrad)" stroke-width="4"/>

  <!-- Classical Academic Roof / Pediment -->
  <path d="M256 96 L400 184 L112 184 Z" fill="#ffffff" filter="url(#subtleShadow)"/>
  <!-- Architrave under roof -->
  <rect x="124" y="192" width="264" height="18" rx="4" fill="#ffffff"/>

  <!-- Pillars (Integrity, Verification, Governance) -->
  <rect x="148" y="220" width="34" height="128" rx="6" fill="#f8fafc"/>
  <rect x="239" y="220" width="34" height="128" rx="6" fill="#f8fafc"/>
  <rect x="330" y="220" width="34" height="128" rx="6" fill="#f8fafc"/>

  <!-- Base Steps Foundation -->
  <rect x="110" y="356" width="292" height="18" rx="4" fill="#ffffff"/>
  <rect x="88" y="382" width="336" height="26" rx="6" fill="#ffffff"/>

  <!-- Central Asset Shield Overlay -->
  <g filter="url(#shadow)">
    <!-- Golden Shield Badge -->
    <path d="M256 216 C294 216 322 228 322 268 C322 328 256 366 256 366 C256 366 190 328 190 268 C190 228 218 216 256 216 Z" 
          fill="url(#goldGrad)" stroke="#ffffff" stroke-width="4"/>
    
    <!-- Verified Asset Checkmark inside Shield -->
    <path d="M230 286 L248 304 L284 262" 
          fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- KVS Crown / Star Accent at apex -->
  <circle cx="256" cy="136" r="9" fill="url(#goldGrad)"/>
</svg>